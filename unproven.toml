# Unproven: with it gone, a bet on an unlisted asset still reverts, at the token call to address 0.
[[claim]]
row = "_listing: asset is listed"
file = "src/FiveMin.sol"
in_fn = "function _listing("
find = "if (address(l.source) == address(0)) revert NotListed(assetId);"
replace = "if (false && address(l.source) == address(0)) revert NotListed(assetId);"

# Unproven and not a hole: redundant, at >= t and at <= block.timestamp already imply it.
[[claim]]
row = "_admissible: block at or after T"
file = "src/FiveMin.sol"
in_fn = "function _admissible("
find = "return block.timestamp >= t && "
replace = "return true && "

[[claim]]
row = "_admissible: block by T + maxDelay"
file = "src/FiveMin.sol"
in_fn = "function _admissible("
find = "&& block.timestamp <= end "
replace = "&& true "
tests_fail = ["test_latePoke_recordsNothing_voidStaysVoid"]

[[claim]]
row = "_admissible: reading at or after T"
file = "src/FiveMin.sol"
in_fn = "function _admissible("
find = "&& at >= t "
replace = "&& true "
tests_fail = ["test_readingBeforeT_orAfterWindow_isNotRecorded"]

# Unproven and not a hole: redundant, at <= block.timestamp <= t + maxDelay already implies it.
[[claim]]
row = "_admissible: reading by T + maxDelay"
file = "src/FiveMin.sol"
in_fn = "function _admissible("
find = "&& at <= end "
replace = "&& true "

[[claim]]
row = "_admissible: reading not ahead of the block"
file = "src/FiveMin.sol"
in_fn = "function _admissible("
find = "&& at <= block.timestamp;"
replace = "&& true;"
tests_fail = ["test_readingAheadOfTheBlock_isNotRecorded"]

[[claim]]
