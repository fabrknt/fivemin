# Each check in src/FiveMin.sol, deleted in turn: which test notices.
# Measured with unproven (https://github.com/fabrknt/unproven). A row with no `tests_fail` is
# unproven: nothing in this repository notices the check is gone. The Monad fork test is left out
# (it needs the network); every other test runs for every row.
#
#   unproven unproven.toml

root = "."
build = "forge build"
test = "forge test --no-match-contract MonadFork --json"
test_format = "forge"

[[claim]]
row = "constructor: treasury is not zero"
file = "src/FiveMin.sol"
in_fn = "constructor(address treasury_) {"
find = "if (treasury_ == address(0)) revert ZeroAddress();"
replace = "if (false && treasury_ == address(0)) revert ZeroAddress();"
tests_fail = ["test_zeroAddresses_andTwoStepOwner"]

[[claim]]
row = "onlyOwner"
file = "src/FiveMin.sol"
in_fn = "modifier onlyOwner() {"
find = "if (msg.sender != owner) revert NotOwner();"
replace = "if (false && msg.sender != owner) revert NotOwner();"
tests_fail = ["test_onlyTheOwnerAdministers"]

[[claim]]
row = "list: asset not already listed"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "if (address(listings[assetId].source) != address(0)) revert AlreadyListed(assetId);"
replace = "if (false && address(listings[assetId].source) != address(0)) revert AlreadyListed(assetId);"
tests_fail = ["test_listingIsFixed_andPauseStopsOnlyNewBets"]

# Unproven and not a hole: a listing whose source is zero reads as not listed, so every call on it reverts NotListed.
[[claim]]
row = "list: source is not zero"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "address(l.source) == address(0) || "
replace = "false || "

[[claim]]
row = "list: token has code"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "|| address(l.token).code.length == 0 "
replace = "|| false "
tests_fail = ["test_listing_capsTheWindow_andRefusesTokensWithoutCode"]

[[claim]]
row = "list: maxDelay is not 0"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "|| l.maxDelay == 0\n"
replace = "|| false\n"
tests_fail = ["test_listing_refusesBadSettings"]

[[claim]]
row = "list: maxDelay within the source's cap"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "|| l.maxDelay > l.source.maxDelayLimit() "
replace = "|| false "
tests_fail = ["test_listing_capsTheWindow_andRefusesTokensWithoutCode"]

[[claim]]
row = "list: fee at most MAX_FEE_BPS"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "|| l.feeBps > MAX_FEE_BPS "
replace = "|| false "
tests_fail = ["test_listing_refusesBadSettings"]

[[claim]]
row = "list: minStake is not 0"
file = "src/FiveMin.sol"
in_fn = "function list("
find = "|| l.minStake == 0\n"
replace = "|| false\n"
tests_fail = ["test_listing_refusesBadSettings"]

