# Unproven: a failed transfer moves nothing, so _pull and _push still revert NotExact.
[[claim]]
row = "_call: the token call succeeded"
file = "src/FiveMin.sol"
in_fn = "function _call("
find = "if (!ok || (ret.length != 0 && !abi.decode(ret, (bool)))) revert TransferFailed();"
replace = "if (false && (!ok || (ret.length != 0 && !abi.decode(ret, (bool))))) revert TransferFailed();"
